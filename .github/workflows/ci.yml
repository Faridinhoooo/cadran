name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite (≥ 22.5) est utilisé par la base et l'import
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests (données de test isolées, sans réseau)
        run: npm test
      - name: Compilation
        run: npm run build
