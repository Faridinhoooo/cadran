<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Illustration indicative d'un smartphone">
  <!-- Illustration générique : aucun logo, aucun objectif photo, aucune caractéristique d'un modèle réel. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3b42"/>
      <stop offset="1" stop-color="#1c1c21"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2a2a31"/>
      <stop offset="0.55" stop-color="#17171b"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="128" y="40" width="144" height="320" rx="26" fill="url(#body)"/>
    <rect x="134" y="46" width="132" height="308" rx="21" fill="url(#screen)"/>
    <rect x="134" y="46" width="132" height="308" rx="21" fill="url(#glare)"/>
    <rect x="186" y="56" width="28" height="7" rx="3.5" fill="#0a0a0b"/>
    <rect x="272" y="118" width="3" height="34" rx="1.5" fill="#2c2c33"/>
  </g>
</svg>
